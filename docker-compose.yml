services:
    db:
        image: postgres:16-alpine
        container_name: vacation-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - db-data:/var/lib/postgresql/data

        #healthcheck configuration for the database service
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-U", "vacation", "-d", "vacationdb"]
            interval: 10s
            timeout: 5s
            retries: 5
    
    # Backend service
    backend:
        build: ./backend
        container_name: vacation-backend
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            PORT: ${PORT}
            COUNTRIES_API_BASE_URL: ${COUNTRIES_API_BASE_URL}
            COUNTRIES_API_FALLBACK_URL: ${COUNTRIES_API_FALLBACK_URL}
        ports:
            - "3001:3001"
        depends_on:
            db:
                condition: service_healthy
        restart: on-failure

    # Frontend service
    frontend:
        build: ./frontend
        container_name: vacation-frontend
        environment:
            REACT_APP_API_URL: ${REACT_APP_API_URL}
        ports:
            - "8080:80"
        volumes:
            - ./frontend:/usr/src/app
        depends_on:
            - backend

volumes:
    db-data:

