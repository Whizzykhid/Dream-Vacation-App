name: Frontend Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-frontend.yml'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-frontend.yml'
  workflow_dispatch:

jobs:
  docker:
    name: Build and Push Frontend image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
                ${{ secrets.DOCKER_USERNAME }}/dream-vacation-frontend:latest
                ${{ secrets.DOCKER_USERNAME }}/dream-vacation-frontend:${{ github.sha }}

      - name: Verify Build & Push Status
        run: |
          echo "Frontend Docker image built successfully"
          echo "Tag: ${{github.sha}}"

      - name: Copy project to EC2 instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "."
          target: "/home/ubuntu/applications/dream-vacation-app"

      - name: Deploy Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd /home/ubuntu/applications/dream-vacation-app
            docker-compose pull
            docker-compose up -d
