name: EC2 Deployment 

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Copy Docker Compose file to EC2 instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY1 }}
          port: ${{ secrets.EC2_PORT }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/dream-vacation-app"

      - name: Deploy Docker Compose on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY1 }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/dream-vacation-app
            
            echo "${{ secrets.ENV_FILE }}" > .env
            
            docker compose pull
            docker compose down
            docker compose up -d
